<!--
  Plantilla del PDF de la proforma.

  Reproduce el documento que REDESK ya envía a sus clientes: logo arriba a la
  izquierda, asunto como título, bloque Nombre / Atte / E-Mail frente a
  FECHA / ASESOR, tabla CANTIDAD-TIPO-DESCRIPCION-PRECIOS-OBSERVACION,
  totales a la derecha, condiciones Notas / Pago / Garantía / Validez con la
  firma al costado, franja de marcas y pie con los datos de contacto.

  Se rellena desde 03_Pdf.js con el objeto `d`. Se convierte a PDF con
  HtmlService, cuyo motor sólo soporta CSS sencillo: tablas, bordes, colores
  y tipografías. No uses flexbox ni grid, no se renderizan.

  Para cambiar el diseño edita sólo este archivo.
-->
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 9.5pt;
    color: #000000;
    margin: 0;
  }
  table { border-collapse: collapse; width: 100%; }

  .titulo {
    font-size: 13pt;
    font-weight: bold;
    padding: 10px 0 4px 0;
  }
  .proforma {
    text-align: right;
    font-size: 12pt;
    font-weight: bold;
    padding-bottom: 6px;
  }
  .proforma .numero { color: <?= d.destacado ?>; }

  table.datos { margin-bottom: 10px; }
  table.datos td { padding: 3px 0; font-size: 10pt; vertical-align: top; }
  table.datos td.et { font-weight: bold; width: 74px; }
  table.datos td.et-der { font-weight: bold; width: 74px; text-align: right; }

  table.items { margin-bottom: 0; }
  table.items th {
    background: <?= d.acento ?>;
    font-size: 8.5pt;
    font-weight: bold;
    padding: 6px 4px;
    border: 1px solid #000000;
    text-align: center;
  }
  table.items td {
    border: 1px solid #000000;
    padding: 8px 6px;
    font-size: 8.5pt;
    line-height: 1.4;
    vertical-align: top;
  }
  .cen { text-align: center; }
  .der { text-align: right; }

  table.totales { width: 250px; }
  table.totales td {
    padding: 4px 6px;
    font-size: 10pt;
    font-weight: bold;
    border: 1px solid #000000;
  }
  table.totales td.et { text-align: right; border: 0; }
  table.totales tr.total td { color: <?= d.destacado ?>; font-size: 11pt; }

  table.cierre { margin-top: 18px; }
  table.cierre td { vertical-align: top; }
  table.condiciones td { padding: 3px 0; font-size: 10pt; }
  table.condiciones td.et { font-weight: bold; width: 82px; }

  .firma { text-align: center; }
  .firma img { max-height: 62px; }
  .firma .atentamente { text-align: left; font-size: 10pt; padding-bottom: 4px; }
  .firma .nombre {
    border-top: 1px solid #000000;
    padding-top: 3px;
    font-size: 10pt;
  }

  .marcas { margin-top: 22px; text-align: center; }
  .marcas img { width: 88%; }

  .pie {
    margin-top: 8px;
    border-top: 1px solid #000000;
    padding-top: 5px;
    font-size: 8.5pt;
    text-align: center;
  }
  .pie a, .pie .enlace { color: <?= d.enlace ?>; }
  .pie .direccion { margin-top: 3px; font-size: 8pt; }
</style>

<table>
  <tr>
    <td style="width:210px; vertical-align:top;">
      <? if (d.logo) { ?>
        <img src="<?= d.logo ?>" style="max-height:64px;">
      <? } else { ?>
        <div style="font-size:15pt; font-weight:bold;"><?= d.empresa ?></div>
      <? } ?>
    </td>
    <td>
      <div class="titulo"><?= d.asunto ?></div>
      <div class="proforma">
        PROFORMA: <span class="numero"><?= d.numero ?></span>
      </div>
    </td>
  </tr>
</table>

<table class="datos">
  <tr>
    <td class="et">Nombre:</td>
    <td><?= d.clienteNombre ?></td>
    <td class="et-der">FECHA:</td>
    <td style="width:110px; text-align:right;"><?= d.fechaTexto ?></td>
  </tr>
  <tr>
    <td class="et">Atte:</td>
    <td><?= d.clienteAtte ?></td>
    <td class="et-der">ASESOR:</td>
    <td style="text-align:right;"><?= d.asesor ?></td>
  </tr>
  <tr>
    <td class="et">E-Mail:</td>
    <td colspan="3"><?= d.clienteEmail ?></td>
  </tr>
</table>

<table class="items">
  <tr>
    <th style="width:56px;">CANTIDAD</th>
    <th style="width:74px;">TIPO</th>
    <th>DESCRIPCION</th>
    <th style="width:66px;">PRECIO<br>UNITARIO</th>
    <th style="width:66px;">PRECIO<br>TOTAL</th>
    <th style="width:76px;">OBSERVACION</th>
  </tr>
  <? for (var i = 0; i < d.items.length; i++) { var it = d.items[i]; ?>
  <tr>
    <td class="cen"><?= it.cantidad ?></td>
    <td class="cen"><?= it.tipo ?></td>
    <td><?!= it.descripcionHtml ?></td>
    <td class="der"><?= it.punitarioTexto ?></td>
    <td class="der"><?= it.totalTexto ?></td>
    <td class="cen"><?= it.observacion ?></td>
  </tr>
  <? } ?>
</table>

<table>
  <tr>
    <td></td>
    <td style="width:250px; padding-top:6px;">
      <table class="totales">
        <tr>
          <td class="et">SUBTOTAL:</td>
          <td class="der"><?= d.subtotalTexto ?></td>
        </tr>
        <tr>
          <td class="et">IVA:</td>
          <td class="der"><?= d.ivaTexto ?></td>
        </tr>
        <tr class="total">
          <td class="et">TOTAL:</td>
          <td class="der"><?= d.totalTexto ?></td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<table class="cierre">
  <tr>
    <td>
      <table class="condiciones">
        <tr>
          <td class="et">Notas:</td>
          <td><?!= d.notasHtml ?></td>
        </tr>
        <tr>
          <td class="et">Pago:</td>
          <td><?= d.pago ?></td>
        </tr>
        <tr>
          <td class="et">Garantía:</td>
          <td><?= d.garantia ?></td>
        </tr>
        <tr>
          <td class="et">Validez:</td>
          <td><?= d.validez ?></td>
        </tr>
      </table>
    </td>
    <td style="width:240px;">
      <div class="firma">
        <div class="atentamente">Atentamente:</div>
        <? if (d.firma) { ?>
          <img src="<?= d.firma ?>">
        <? } else { ?>
          <div style="height:52px;"></div>
        <? } ?>
        <div class="nombre"><?= d.representante ?></div>
      </div>
    </td>
  </tr>
</table>

<? if (d.marcas) { ?>
<div class="marcas"><img src="<?= d.marcas ?>"></div>
<? } ?>

<div class="pie">
  <span class="enlace"><?= d.web ?></span>
  &nbsp;&nbsp;·&nbsp;&nbsp;
  <span class="enlace"><?= d.email ?></span>
  &nbsp;&nbsp;·&nbsp;&nbsp;
  <?= d.telefonos ?>
  <div class="direccion"><?= d.direccion ?></div>
</div>
