<!--
  Plantilla del PDF de la proforma.

  Reproduce el documento que REDESK ya envía: logo arriba a la izquierda,
  asunto como título, PROFORMA en rojo, bloque Nombre / Atte / E-Mail frente
  a FECHA / ASESOR, tabla CANTIDAD-TIPO-DESCRIPCION-PRECIOS-OBSERVACION,
  totales a la derecha, condiciones Notas / Pago / Garantía / Validez con la
  firma al costado, franja de marcas y pie de contacto.

  DOS REGLAS AL EDITAR ESTE ARCHIVO:

  1. Los estilos van EN LÍNEA, en el atributo style de cada elemento. El
     camino normal de generación convierte este HTML en Documento de Google,
     y ese importador ignora las clases de un bloque <style>. Lo de abajo
     está sólo para la previsualización y para el respaldo de HtmlService.

  2. Donde va una imagen se escribe su marca —[[LOGO]], [[FIRMA]],
     [[MARCAS]]— sola en su párrafo. 03_Pdf.js la sustituye por la imagen
     de verdad sobre el documento ya convertido, porque ningún conversor de
     HTML de Google incrusta imágenes por sí solo.
-->
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 9.5pt; color: #000; margin: 0; }
  table { border-collapse: collapse; }
  p { margin: 0; }
</style>

<table style="width:100%; border-collapse:collapse;">
  <tr>
    <td style="width:34%; vertical-align:top; padding:0;">
      <? if (d.logo) { ?>
        <p style="margin:0;"><?= d.logo ?></p>
      <? } else { ?>
        <p style="margin:0; font-size:15pt; font-weight:bold;"><?= d.empresa ?></p>
      <? } ?>
    </td>
    <td style="width:66%; vertical-align:top; padding:0;">
      <p style="margin:0 0 6pt 0; font-size:13pt; font-weight:bold;"><?= d.asunto ?></p>
      <p style="margin:0; font-size:12pt; font-weight:bold; text-align:right;">
        PROFORMA: <span style="color:<?= d.destacado ?>;"><?= d.numero ?></span>
      </p>
    </td>
  </tr>
</table>

<p style="margin:8pt 0 0 0;">&nbsp;</p>

<table style="width:100%; border-collapse:collapse;">
  <tr>
    <td style="width:12%; padding:2pt 0; font-size:10pt; font-weight:bold;">Nombre:</td>
    <td style="width:53%; padding:2pt 0; font-size:10pt;"><?= d.clienteNombre ?></td>
    <td style="width:15%; padding:2pt 0; font-size:10pt; font-weight:bold; text-align:right;">FECHA:</td>
    <td style="width:20%; padding:2pt 0; font-size:10pt; text-align:right;"><?= d.fechaTexto ?></td>
  </tr>
  <tr>
    <td style="padding:2pt 0; font-size:10pt; font-weight:bold;">Atte:</td>
    <td style="padding:2pt 0; font-size:10pt;"><?= d.clienteAtte ?></td>
    <td style="padding:2pt 0; font-size:10pt; font-weight:bold; text-align:right;">ASESOR:</td>
    <td style="padding:2pt 0; font-size:10pt; text-align:right;"><?= d.asesor ?></td>
  </tr>
  <tr>
    <td style="padding:2pt 0; font-size:10pt; font-weight:bold;">E-Mail:</td>
    <td colspan="3" style="padding:2pt 0; font-size:10pt;"><?= d.clienteEmail ?></td>
  </tr>
</table>

<p style="margin:10pt 0 0 0;">&nbsp;</p>

<table border="1" cellspacing="0" cellpadding="4"
       style="width:100%; border-collapse:collapse; border:1px solid #000000;">
  <tr>
    <td width="8%" style="border:1px solid #000000; background-color:<?= d.acento ?>; font-size:8.5pt; font-weight:bold; text-align:center;">CANTIDAD</td>
    <td width="11%" style="border:1px solid #000000; background-color:<?= d.acento ?>; font-size:8.5pt; font-weight:bold; text-align:center;">TIPO</td>
    <td width="45%" style="border:1px solid #000000; background-color:<?= d.acento ?>; font-size:8.5pt; font-weight:bold; text-align:center;">DESCRIPCION</td>
    <td width="11%" style="border:1px solid #000000; background-color:<?= d.acento ?>; font-size:8.5pt; font-weight:bold; text-align:center;">PRECIO UNITARIO</td>
    <td width="11%" style="border:1px solid #000000; background-color:<?= d.acento ?>; font-size:8.5pt; font-weight:bold; text-align:center;">PRECIO TOTAL</td>
    <td width="14%" style="border:1px solid #000000; background-color:<?= d.acento ?>; font-size:8.5pt; font-weight:bold; text-align:center;">OBSERVACION</td>
  </tr>
  <? for (var i = 0; i < d.items.length; i++) { var it = d.items[i]; ?>
  <tr>
    <td style="border:1px solid #000000; font-size:8.5pt; text-align:center; vertical-align:top;"><?= it.cantidad ?></td>
    <td style="border:1px solid #000000; font-size:8.5pt; text-align:center; vertical-align:top;"><?= it.tipo ?></td>
    <td style="border:1px solid #000000; font-size:8.5pt; vertical-align:top;"><?!= it.descripcionHtml ?></td>
    <td style="border:1px solid #000000; font-size:8.5pt; text-align:right; vertical-align:top;"><?= it.punitarioTexto ?></td>
    <td style="border:1px solid #000000; font-size:8.5pt; text-align:right; vertical-align:top;"><?= it.totalTexto ?></td>
    <td style="border:1px solid #000000; font-size:8.5pt; text-align:center; vertical-align:top;"><?= it.observacion ?></td>
  </tr>
  <? } ?>
</table>

<p style="margin:6pt 0 0 0;">&nbsp;</p>

<table style="width:100%; border-collapse:collapse;">
  <tr>
    <td style="width:62%; padding:0;">&nbsp;</td>
    <td style="width:23%; padding:3pt 6pt; font-size:10pt; font-weight:bold; text-align:right;">SUBTOTAL:</td>
    <td style="width:15%; padding:3pt 6pt; font-size:10pt; font-weight:bold; text-align:right; border:1px solid #000000;"><?= d.subtotalTexto ?></td>
  </tr>
  <tr>
    <td style="padding:0;">&nbsp;</td>
    <td style="padding:3pt 6pt; font-size:10pt; font-weight:bold; text-align:right;">IVA:</td>
    <td style="padding:3pt 6pt; font-size:10pt; font-weight:bold; text-align:right; border:1px solid #000000;"><?= d.ivaTexto ?></td>
  </tr>
  <tr>
    <td style="padding:0;">&nbsp;</td>
    <td style="padding:3pt 6pt; font-size:11pt; font-weight:bold; text-align:right; color:<?= d.destacado ?>;">TOTAL:</td>
    <td style="padding:3pt 6pt; font-size:11pt; font-weight:bold; text-align:right; color:<?= d.destacado ?>; border:1px solid #000000;"><?= d.totalTexto ?></td>
  </tr>
</table>

<p style="margin:12pt 0 0 0;">&nbsp;</p>

<table style="width:100%; border-collapse:collapse;">
  <tr>
    <td style="width:58%; vertical-align:top; padding:0;">
      <table style="width:100%; border-collapse:collapse;">
        <tr>
          <td style="width:26%; padding:2pt 0; font-size:10pt; font-weight:bold;">Notas:</td>
          <td style="padding:2pt 0; font-size:10pt;"><?!= d.notasHtml ?></td>
        </tr>
        <tr>
          <td style="padding:2pt 0; font-size:10pt; font-weight:bold;">Pago:</td>
          <td style="padding:2pt 0; font-size:10pt;"><?= d.pago ?></td>
        </tr>
        <tr>
          <td style="padding:2pt 0; font-size:10pt; font-weight:bold;">Garantía:</td>
          <td style="padding:2pt 0; font-size:10pt;"><?= d.garantia ?></td>
        </tr>
        <tr>
          <td style="padding:2pt 0; font-size:10pt; font-weight:bold;">Validez:</td>
          <td style="padding:2pt 0; font-size:10pt;"><?= d.validez ?></td>
        </tr>
      </table>
    </td>
    <td style="width:42%; vertical-align:top; padding:0; text-align:center;">
      <p style="margin:0 0 4pt 0; font-size:10pt; text-align:left;">Atentamente:</p>
      <? if (d.firma) { ?>
        <p style="margin:0; text-align:center;"><?= d.firma ?></p>
      <? } else { ?>
        <p style="margin:0;">&nbsp;</p>
        <p style="margin:0;">&nbsp;</p>
      <? } ?>
      <p style="margin:0; font-size:10pt; text-align:center; border-top:1px solid #000000;">
        <?= d.representante ?>
      </p>
    </td>
  </tr>
</table>

<? if (d.marcas) { ?>
<p style="margin:16pt 0 0 0; text-align:center;"><?= d.marcas ?></p>
<? } ?>

<p style="margin:8pt 0 0 0; font-size:8.5pt; text-align:center; border-top:1px solid #000000;">
  <span style="color:<?= d.enlace ?>;"><?= d.web ?></span>
  &nbsp;&nbsp;·&nbsp;&nbsp;
  <span style="color:<?= d.enlace ?>;"><?= d.email ?></span>
  &nbsp;&nbsp;·&nbsp;&nbsp;
  <?= d.telefonos ?>
</p>
<p style="margin:2pt 0 0 0; font-size:8pt; text-align:center;"><?= d.direccion ?></p>
