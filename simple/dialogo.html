<!--
  Diálogo de "Leer precios de proveedor".

  Admite varios archivos en la misma tanda: se leen uno a uno, los resultados
  se van acumulando y se revisan todos juntos antes de escribir nada en la
  hoja. Se puede volver a añadir archivos sin perder lo ya reconocido.

  Las líneas que el reconocimiento no da por seguras, y las repetidas entre
  archivos, llegan desmarcadas.
-->
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    color: #202124;
    margin: 0;
    padding: 16px;
  }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .ayuda { color: #5f6368; margin: 0 0 14px; }

  .caja {
    border: 2px dashed #c6cbd1;
    border-radius: 6px;
    padding: 18px;
    text-align: center;
    background: #fafbfc;
  }

  button {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid #1a73e8;
    background: #1a73e8;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secundario { background: #fff; color: #1a73e8; }

  .estado { margin: 12px 0; min-height: 18px; }
  .error { color: #c5221f; }
  .ok { color: #1e8e3e; }

  #progreso { margin: 12px 0; }
  #progreso div {
    padding: 3px 0;
    border-bottom: 1px solid #f1f3f4;
    display: flex;
    gap: 8px;
  }
  #progreso .nombre {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #progreso .dato { color: #5f6368; white-space: nowrap; }

  #resultado { display: none; }
  .tabla-caja {
    max-height: 260px;
    overflow-y: auto;
    border: 1px solid #dadce0;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  table { border-collapse: collapse; width: 100%; }
  th {
    position: sticky;
    top: 0;
    background: #f1f3f4;
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #5f6368;
    padding: 7px 8px;
    border-bottom: 1px solid #dadce0;
  }
  td {
    padding: 6px 8px;
    border-bottom: 1px solid #f1f3f4;
    vertical-align: top;
  }
  td.precio { text-align: right; font-variant-numeric: tabular-nums; }
  td.archivo {
    color: #5f6368;
    font-size: 11px;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tr.dudosa td { background: #fef7e0; }
  tr.repetida td { background: #f8f9fa; color: #80868b; }
  .nota { font-size: 11px; display: block; }
  .nota.aviso { color: #b06000; }
  .nota.repe { color: #80868b; }

  .pie { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pie .cuenta { color: #5f6368; margin-right: auto; }
</style>

<h2>Leer precios de proveedor</h2>
<p class="ayuda">
  Elige uno o varios PDF o fotos. Se reconocen la descripción y el precio de
  cada línea; el resto lo escribes tú.
</p>

<div id="paso-archivo">
  <div class="caja">
    <input type="file" id="archivo" accept="image/*,application/pdf" multiple>
    <p class="ayuda" style="margin:10px 0 0">
      Puedes seleccionar varios a la vez. Cuanto más nítida y recortada esté
      cada imagen, mejor sale.
    </p>
  </div>
  <div id="progreso"></div>
  <div class="estado" id="estado"></div>
  <div class="pie">
    <span class="cuenta" id="acumulado"></span>
    <button class="secundario" id="volver" style="display:none">Ver lo reconocido</button>
    <button id="leer" disabled>Leer archivos</button>
  </div>
</div>

<div id="resultado">
  <div class="tabla-caja">
    <table>
      <thead>
        <tr>
          <th style="width:28px"><input type="checkbox" id="todos"></th>
          <th>Descripción</th>
          <th style="width:86px; text-align:right">Precio</th>
          <th style="width:120px">Archivo</th>
        </tr>
      </thead>
      <tbody id="filas"></tbody>
    </table>
  </div>
  <div class="pie">
    <span class="cuenta" id="cuenta"></span>
    <button class="secundario" id="mas">Añadir más archivos</button>
    <button id="insertar">Añadir a la hoja</button>
  </div>
  <div class="estado" id="estado2"></div>
</div>

<script>
  // Todo lo reconocido en esta sesión del diálogo, de todos los archivos.
  var items = [];

  function $(id) { return document.getElementById(id); }

  function estado(donde, texto, clase) {
    var el = $(donde);
    el.textContent = texto || '';
    el.className = 'estado ' + (clase || '');
  }

  function acumulado() {
    $('acumulado').textContent = items.length
      ? items.length + ' línea(s) reconocidas hasta ahora'
      : '';
    $('volver').style.display = items.length ? 'inline-block' : 'none';
  }

  $('archivo').addEventListener('change', function () {
    $('leer').disabled = !this.files.length;
    estado('estado', '');
  });

  $('leer').addEventListener('click', function () {
    var archivos = Array.prototype.slice.call($('archivo').files);
    if (!archivos.length) return;

    $('leer').disabled = true;
    $('progreso').innerHTML = '';
    estado('estado', '');
    leerUno(archivos, 0);
  });

  /**
   * Lee los archivos de uno en uno. En serie y no en paralelo: cada OCR es
   * una subida a Drive, y lanzarlos todos a la vez agota la cuota.
   */
  function leerUno(archivos, i) {
    if (i >= archivos.length) {
      $('leer').disabled = false;
      $('archivo').value = '';
      if (items.length) mostrar();
      else estado('estado', 'Ningún archivo dio líneas reconocibles.', 'error');
      return;
    }

    var archivo = archivos[i];
    var linea = document.createElement('div');
    var nombre = document.createElement('span');
    nombre.className = 'nombre';
    nombre.textContent = archivo.name;
    var dato = document.createElement('span');
    dato.className = 'dato';
    dato.textContent = 'leyendo…';
    linea.appendChild(nombre);
    linea.appendChild(dato);
    $('progreso').appendChild(linea);

    estado('estado', 'Archivo ' + (i + 1) + ' de ' + archivos.length +
      '. Esto tarda unos segundos por archivo.');

    var lector = new FileReader();
    lector.onerror = function () {
      dato.textContent = 'no se pudo abrir';
      dato.className = 'dato error';
      leerUno(archivos, i + 1);
    };
    lector.onload = function (e) {
      // Se envía sólo el contenido, sin la cabecera "data:...;base64,".
      var base64 = String(e.target.result).split(',')[1];
      google.script.run
        .withSuccessHandler(function (resultado) {
          var nuevos = resultado.items || [];
          items = items.concat(nuevos);
          dato.textContent = nuevos.length
            ? nuevos.length + ' línea(s)'
            : 'sin resultados';
          dato.className = 'dato' + (nuevos.length ? ' ok' : '');
          acumulado();
          leerUno(archivos, i + 1);
        })
        .withFailureHandler(function (err) {
          dato.textContent = err.message || String(err);
          dato.className = 'dato error';
          leerUno(archivos, i + 1);
        })
        .reconocerArchivo(base64, archivo.name, archivo.type);
    };
    lector.readAsDataURL(archivo);
  }

  function mostrar() {
    var cuerpo = $('filas');
    cuerpo.innerHTML = '';
    var vistas = {};

    items.forEach(function (item, i) {
      var repetida = !!vistas[item.clave];
      vistas[item.clave] = true;

      var fila = document.createElement('tr');
      if (repetida) fila.className = 'repetida';
      else if (!item.seguro) fila.className = 'dudosa';

      var celdaMarca = document.createElement('td');
      var marca = document.createElement('input');
      marca.type = 'checkbox';
      marca.checked = item.seguro && !repetida;
      marca.dataset.indice = String(i);
      marca.addEventListener('change', contar);
      celdaMarca.appendChild(marca);

      var celdaDesc = document.createElement('td');
      celdaDesc.textContent = item.descripcion;
      if (repetida) {
        celdaDesc.appendChild(nota('Repetida: ya aparece más arriba.', 'repe'));
      } else if (!item.seguro) {
        celdaDesc.appendChild(nota(
          'Sin decimales ni símbolo: revisa que el precio sea ése.', 'aviso'));
      }

      var celdaPrecio = document.createElement('td');
      celdaPrecio.className = 'precio';
      celdaPrecio.textContent = Number(item.precio).toFixed(2);

      var celdaArchivo = document.createElement('td');
      celdaArchivo.className = 'archivo';
      celdaArchivo.textContent = item.archivo || '';
      celdaArchivo.title = item.archivo || '';

      fila.appendChild(celdaMarca);
      fila.appendChild(celdaDesc);
      fila.appendChild(celdaPrecio);
      fila.appendChild(celdaArchivo);
      cuerpo.appendChild(fila);
    });

    $('paso-archivo').style.display = 'none';
    $('resultado').style.display = 'block';
    estado('estado2', '');
    contar();
  }

  function nota(texto, clase) {
    var el = document.createElement('span');
    el.className = 'nota ' + clase;
    el.textContent = texto;
    return el;
  }

  function marcadas() {
    var seleccion = [];
    var marcas = $('filas').querySelectorAll('input[type=checkbox]');
    for (var i = 0; i < marcas.length; i++) {
      if (marcas[i].checked) {
        seleccion.push(items[Number(marcas[i].dataset.indice)]);
      }
    }
    return seleccion;
  }

  function contar() {
    var n = marcadas().length;
    $('cuenta').textContent = n + ' de ' + items.length + ' marcadas';
    $('insertar').disabled = n === 0;
    $('todos').checked = n === items.length && n > 0;
  }

  $('todos').addEventListener('change', function () {
    var marcas = $('filas').querySelectorAll('input[type=checkbox]');
    for (var i = 0; i < marcas.length; i++) marcas[i].checked = this.checked;
    contar();
  });

  $('mas').addEventListener('click', function () {
    $('resultado').style.display = 'none';
    $('paso-archivo').style.display = 'block';
    $('progreso').innerHTML = '';
    $('archivo').value = '';
    $('leer').disabled = true;
    estado('estado', '');
    acumulado();
  });

  $('volver').addEventListener('click', mostrar);

  $('insertar').addEventListener('click', function () {
    var seleccion = marcadas();
    $('insertar').disabled = true;
    estado('estado2', 'Añadiendo ' + seleccion.length + ' línea(s)…');
    google.script.run
      .withSuccessHandler(function (mensaje) {
        estado('estado2', mensaje + ' Ya puedes cerrar.', 'ok');
      })
      .withFailureHandler(function (err) {
        $('insertar').disabled = false;
        estado('estado2', err.message || String(err), 'error');
      })
      .insertarItems(seleccion);
  });
</script>
